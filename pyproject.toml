[project]
name = "ha-solaredge-cloud"
version = "0.2.0"
description = "Home Assistant custom integration for SolarEdge through the mySolarEdge app API"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py313"
